name: Scan Lichess team battles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scanner
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          python -u script.py

      - name: Show Markdown report
        run: |
          cat output/matches.md

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: lichess-team-battle-matches
          path: output/
          if-no-files-found: error
